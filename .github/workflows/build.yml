name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_override:
        description: "Optional release version override (defaults to pyproject.toml)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Qt runtime libraries for smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon0

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version_override }}" ]]; then
            echo "value=${{ inputs.version_override }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies (Windows, locked CPU PyTorch)
        if: runner.os == 'Windows'
        run: uv sync --frozen --no-dev --group build

      - name: Install dependencies (Linux, CPU-only PyTorch)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv venv .venv-build --python 3.12
          uv pip install --no-config --python .venv-build \
            --index https://download.pytorch.org/whl/cpu \
            --default-index https://pypi.org/simple \
            torch torchvision
          uv pip install --no-config --python .venv-build --no-upgrade . "pyinstaller>=6.12.0"

      - name: Build, smoke-test, and archive application (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          args=()
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            args+=(--version "${{ steps.version.outputs.value }}")
          fi
          uv run --no-sync python scripts/build.py "${args[@]}"

      - name: Build, smoke-test, and archive application (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          args=(--require-cpu-torch)
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            args+=(--version "${{ steps.version.outputs.value }}")
          fi
          .venv-build/bin/python scripts/build.py "${args[@]}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-asset-extractor-${{ matrix.platform }}
          path: dist/artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Combine SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
