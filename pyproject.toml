[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pdf-asset-extractor"
version = "0.1.0"
description = "A fast and clean utility to extract high-res images from PDFs"
authors = [
  {name = "Norbert Gwiazda", email = "norbert.gwiazda@icloud.com"}
]
license="MIT"
license-files=["LICENSE*"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyside6>=6.10.0",
  "pyside6-fluent-widgets[full]>=1.11.3",
]

[project.scripts]
gui = "pdf_asset_extractor.ui.main_window:main"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
type_check = [
  "basedpyright>=1.40.0",
]
lint = [
  "ruff",
  "rumdl",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
extend-ignore = [
  "RUF005",
  "RUF012",
]
unfixable = [
  "F401",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports="all"

[tool.rumdl]
line-length = 99
disable = [
  "MD033",
]
